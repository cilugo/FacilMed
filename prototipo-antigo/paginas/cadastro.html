<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facilmed - Cadastro</title>
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <main class="login-page">
        <!-- PAINEL DA MARCA (some no celular) -->
        <section class="login-brand">
            <div class="login-brand__blob login-brand__blob--1"></div>
            <div class="login-brand__blob login-brand__blob--2"></div>
            <div class="login-brand__blob login-brand__blob--3"></div>
            <a href="index.html">
                <img src="../imgs/logocomslogan.png" alt="FacilMed - Sua saúde, conectada." class="login-brand__logo">
            </a>
        </section>
        <!-- PAINEL DE ESCOLHA -->
        <section class="login-form-area">
            <div class="login-container">
                <!-- LOGO (só aparece no celular, no lugar do painel da marca) -->
                <img
                    src="../imgs/logocomslogan.png"
                    alt="FacilMed"
                    class="login-mobile-logo"
                >
                <!-- TÍTULO -->
                <h1 class="title">
                    Como você deseja se cadastrar?
                </h1>
                <p class="subtitle">
                    Escolha uma opção para continuar
                </p>
                <!-- OPÇÕES DE CADASTRO -->
                <nav class="buttongroup" aria-label="Tipo de cadastro">
                    <a href="cadastro-paciente.html" class="login-button">
                        Conta Pessoal
                    </a>
                    <a href="cadastro-clinica.html" class="login-button">
                        Conta Empresarial
                    </a>
                </nav>
                <!-- LOGIN -->
                <p class="register">
                    Já tem uma conta?
                    <a href="prelogin.html">
                        Entre
                    </a>
                </p>
            </div>
        </section>
    </main>
</body>
</html>
