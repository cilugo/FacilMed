<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FacilMed · Cadastro de clínica ou hospital</title>
  <link rel="stylesheet" href="../css/cadastro-clinica.css" />
</head>
<body>
  <main class="pagina">

    <!-- Painel da marca -->
    <section class="marca" aria-label="FacilMed">
      <div class="circulo circulo--1"></div>
      <div class="circulo circulo--2"></div>
      <div class="circulo circulo--3"></div>

      <div class="logo">
        <a href="../paginas/index.html">
          <img class="logo__imagem" src="../imgs/logocomslogan.png" alt="logo com slogan" />
        </a>
      </div>
    </section>

    <!-- Formulário -->
    <section class="conteudo">
      <form class="formulario" id="form-clinica" novalidate>
        <h1>Cadastro de clínica ou hospital</h1>
        <p class="subtitulo">Preencha os dados abaixo para criar sua conta na plataforma.</p>

        <!-- Tipo de estabelecimento -->
        <fieldset class="card">
          <legend class="card__cabecalho">
            <span class="card__icone">
              <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 21V7l8-4 8 4v14"/><path d="M4 21h16M9 21v-5h6v5"/></svg>
            </span>
            <span class="card__titulo">Tipo de estabelecimento</span>
          </legend>

          <div class="card__corpo">
            <div class="tipos" role="radiogroup" aria-label="Tipo de estabelecimento">
              <label class="tipo">
                <input type="radio" name="tipo" value="clinica" required />
                <span class="tipo__conteudo">
                  <svg class="icone tipo__icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18M5 21V10l7-5 7 5v11"/><path d="M12 10v5M9.5 12.5h5"/></svg>
                  <span>
                    <strong>Clínica</strong>
                    <small>Consultórios, clínicas e centros médicos</small>
                  </span>
                </span>
              </label>

              <label class="tipo">
                <input type="radio" name="tipo" value="hospital" />
                <span class="tipo__conteudo">
                  <svg class="icone tipo__icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="1"/><rect x="7" y="3" width="10" height="18" rx="1"/><path d="M12 6v5M9.5 8.5h5M10 21v-4h4v4"/></svg>
                  <span>
                    <strong>Hospital</strong>
                    <small>Hospitais, prontos-socorros e similares</small>
                  </span>
                </span>
              </label>
            </div>
            <p class="erro" id="erro-tipo" aria-live="polite"></p>
          </div>
        </fieldset>

        <!-- Dados da instituição -->
        <fieldset class="card">
          <legend class="card__cabecalho">
            <span class="card__icone">
              <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="1"/><rect x="7" y="3" width="10" height="18" rx="1"/><path d="M12 6v5M9.5 8.5h5"/></svg>
            </span>
            <span class="card__titulo">Dados da instituição</span>
          </legend>

          <div class="card__corpo grade">
            <div class="campo">
              <label for="razao-social">Razão social / nome da instituição *</label>
              <div class="entrada">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="1"/><rect x="7" y="3" width="10" height="18" rx="1"/></svg>
                <input id="razao-social" name="razao-social" type="text" placeholder="Ex.: Hospital São Lucas" autocomplete="organization" required />
              </div>
              <p class="erro" aria-live="polite"></p>
            </div>

            <div class="campo">
              <label for="cnpj">CNPJ *</label>
              <div class="entrada">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
                <input id="cnpj" name="cnpj" type="text" inputmode="numeric" placeholder="00.000.000/0000-00" maxlength="18" required />
              </div>
              <p class="erro" aria-live="polite"></p>
            </div>

            <div class="campo">
              <label for="cnes">CNES *</label>
              <div class="entrada">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M12 8v6M9 11h6"/></svg>
                <input id="cnes" name="cnes" type="text" inputmode="numeric" placeholder="0000000" maxlength="7" required />
              </div>
              <p class="erro" aria-live="polite"></p>
            </div>

            <div class="campo">
              <label for="endereco">Endereço *</label>
              <div class="entrada">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>
                <input id="endereco" name="endereco" type="text" placeholder="Rua, número, bairro, cidade - UF" autocomplete="street-address" required />
              </div>
              <p class="erro" aria-live="polite"></p>
            </div>

            <div class="campo">
              <label for="telefone">Telefone *</label>
              <div class="entrada">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
                <input id="telefone" name="telefone" type="tel" placeholder="(11) 98765-4321" maxlength="15" autocomplete="tel" required />
              </div>
              <p class="erro" aria-live="polite"></p>
            </div>

            <div class="campo">
              <label for="email">E-mail *</label>
              <div class="entrada">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
                <input id="email" name="email" type="email" placeholder="contato@instituicao.com.br" autocomplete="email" required />
              </div>
              <p class="erro" aria-live="polite"></p>
            </div>
          </div>
        </fieldset>

        <!-- Responsável -->
        <fieldset class="card">
          <legend class="card__cabecalho">
            <span class="card__icone">
              <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1c0-3.3 3.6-6 8-6s8 2.7 8 6v1z"/></svg>
            </span>
            <span class="card__titulo">Responsável pela instituição</span>
          </legend>

          <div class="card__corpo grade">
            <div class="campo">
              <label for="responsavel">Nome completo *</label>
              <div class="entrada">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1c0-3.3 3.6-6 8-6s8 2.7 8 6v1z"/></svg>
                <input id="responsavel" name="responsavel" type="text" placeholder="Ex.: Maria Silva Santos" autocomplete="name" required />
              </div>
              <p class="erro" aria-live="polite"></p>
            </div>

            <div class="campo">
              <label for="cargo">Cargo *</label>
              <div class="entrada">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 12h18"/></svg>
                <input id="cargo" name="cargo" type="text" placeholder="Ex.: Diretor(a) administrativo(a)" autocomplete="organization-title" required />
              </div>
              <p class="erro" aria-live="polite"></p>
            </div>
          </div>
        </fieldset>

        <!-- Acesso -->
        <fieldset class="card">
          <legend class="card__cabecalho">
            <span class="card__icone">
              <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
            </span>
            <span class="card__titulo">Dados de acesso</span>
          </legend>

          <div class="card__corpo grade">
            <div class="campo">
              <label for="usuario">Usuário *</label>
              <div class="entrada">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1c0-3.3 3.6-6 8-6s8 2.7 8 6v1z"/></svg>
                <input id="usuario" name="usuario" type="text" placeholder="Digite o usuário" autocomplete="username" required />
              </div>
              <p class="erro" aria-live="polite"></p>
            </div>

            <div class="campo">
              <label for="senha">Senha *</label>
              <div class="entrada">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
                <input id="senha" name="senha" type="password" placeholder="Digite a senha" minlength="8" autocomplete="new-password" required />
                <button type="button" class="mostrar-senha" aria-label="Mostrar senha" data-alvo="senha">
                  <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
              <p class="erro" aria-live="polite"></p>
            </div>
          </div>
        </fieldset>

        <div class="rodape">
          <p class="entrar">Já tem uma conta? <a href="/login">Entrar</a></p>
          <button type="submit" class="botao">
            Próximo
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
          </button>
        </div>
      </form>
    </section>

  </main>

  <script src="cadastro-clinica.js"></script>
</body>
</html>
