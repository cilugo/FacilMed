<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facilmed - Login</title>

    <link rel="stylesheet" href="../css/login.css">
</head>


<body>

    <main class="login-page">

        <!-- PAINEL DA MARCA (some no celular) -->
        <section class="login-brand">
            <div class="login-brand__blob login-brand__blob--1"></div>
            <div class="login-brand__blob login-brand__blob--2"></div>
            <div class="login-brand__blob login-brand__blob--3"></div>

            <img
                src="../imgs/logocomslogan.png"
                alt="FacilMed - Sua saúde, conectada."
                class="login-brand__logo"
            >
        </section>


        <!-- PAINEL DO FORMULÁRIO -->
        <section class="login-form-area">

            <div class="login-container">

                <!-- LOGO (só aparece no celular, no lugar do painel da marca) -->
                <img
                    src="../imgs/logocomslogan.png"
                    alt="FacilMed"
                    class="login-mobile-logo"
                >

                <!-- TÍTULO -->
                <h1 class="title">
                    Bem-vindo!
                </h1>

                <p class="subtitle">
                    Escolha sua funcionalidade para continuar com o seu login
                </p>


                <div class="buttongroup">

                    <a href="login.html" class="login-button">
                        <button type="submit" class="login-button">
                            Sou paciente
                        </button>
                    </a><br>
                        
                    <a href="login.html" class="login-button">
                        <button type="submit" class="login-button">
                            Sou médico
                        </button>
                    </a><br>
                        
                    <a href="login.html">
                        <button type="submit" class="login-button">
                            Sou clínica/hospital
                        </button>
                    </a>
                </div>


                <!-- CADASTRO -->
                <p class="register">

                    Não tem uma conta?

                    <a href="precadastro.html">
                        Cadastre-se
                    </a>

                </p>

            </div>

        </section>

    </main>

</body>

</html>
