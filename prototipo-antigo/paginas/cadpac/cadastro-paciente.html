<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FacilMed · Cadastro de paciente</title>
  <link rel="stylesheet" href="cadastro-paciente.css" />
</head>
<body>
  <main class="pagina">

    <!-- Painel da marca -->
    <section class="marca" aria-label="FacilMed">
      <div class="circulo circulo--1"></div>
      <div class="circulo circulo--2"></div>
      <div class="circulo circulo--3"></div>

      <div class="logo">
        <img class="logo_imagem" src="logo.svg" width="160" height="140" alt="" />
        <div class="logo_nome"><span>Facil</span><span>Med</span></div>
        <p class="logo_slogan">Sua saúde, conectada.</p>
      </div>
    </section>

    <!-- Formulário -->
    <section class="conteudo">
      <form class="formulario" id="form-paciente" novalidate>
        <h1>Crie sua conta</h1>
        <p class="subtitulo">Preencha os dados abaixo para se cadastrar na plataforma.</p>

        <div class="card">
          <div class="card__cabecalho">
            <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1c0-3.3 3.6-6 8-6s8 2.7 8 6v1z"/></svg>
            <h2>Dados pessoais</h2>
          </div>

          <div class="card__corpo grade">

            <div class="campo campo--inteiro">
              <label for="nome">Nome completo *</label>
              <div class="entrada">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1c0-3.3 3.6-6 8-6s8 2.7 8 6v1z"/></svg>
                <input id="nome" name="nome" type="text" placeholder="Ex.: Maria Silva Santos" autocomplete="name" required />
              </div>
              <p class="erro" aria-live="polite"></p>
            </div>

            <div class="campo">
              <label for="cpf">CPF *</label>
              <div class="entrada">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><circle cx="12" cy="10" r="2.5"/><path d="M8 17c.6-2 2.1-3 4-3s3.4 1 4 3"/></svg>
                <input id="cpf" name="cpf" type="text" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" required />
              </div>
              <p class="erro" aria-live="polite"></p>
            </div>

            <div class="campo">
              <label for="nascimento">Data de nascimento *</label>
              <div class="entrada">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
                <input id="nascimento" name="nascimento" type="text" inputmode="numeric" placeholder="DD/MM/AAAA" maxlength="10" required />
              </div>
              <p class="erro" aria-live="polite"></p>
            </div>

            <div class="campo">
              <label for="sexo">Sexo *</label>
              <div class="entrada entrada--select">
                <select id="sexo" name="sexo" required>
                  <option value="" selected disabled>Selecione</option>
                  <option value="masculino">Masculino</option>
                  <option value="feminino">Feminino</option>
                  <option value="nao-informado">Prefiro não informar</option>
                </select>
                <svg class="icone icone--seta" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
              </div>
              <p class="erro" aria-live="polite"></p>
            </div>

            <div class="campo">
              <label for="telefone">Telefone *</label>
              <div class="entrada">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>
                <input id="telefone" name="telefone" type="tel" placeholder="(11) 98765-4321" maxlength="15" autocomplete="tel" required />
              </div>
              <p class="erro" aria-live="polite"></p>
            </div>

            <div class="campo campo--inteiro">
              <label for="email">E-mail *</label>
              <div class="entrada">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
                <input id="email" name="email" type="email" placeholder="exemplo@email.com" autocomplete="email" required />
              </div>
              <p class="erro" aria-live="polite"></p>
            </div>

            <div class="campo">
              <label for="senha">Senha *</label>
              <div class="entrada">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
                <input id="senha" name="senha" type="password" placeholder="Digite sua senha" minlength="8" autocomplete="new-password" required />
                <button type="button" class="mostrar-senha" aria-label="Mostrar senha" data-alvo="senha">
                  <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
              <p class="erro" aria-live="polite"></p>
            </div>

            <div class="campo">
              <label for="confirmar-senha">Confirmar senha *</label>
              <div class="entrada">
                <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg>
                <input id="confirmar-senha" name="confirmar-senha" type="password" placeholder="Confirme sua senha" autocomplete="new-password" required />
                <button type="button" class="mostrar-senha" aria-label="Mostrar senha" data-alvo="confirmar-senha">
                  <svg class="icone" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
              <p class="erro" aria-live="polite"></p>
            </div>

          </div>
        </div>

        <div class="rodape">
          <p class="entrar">Já tem uma conta? <a href="/login">Entrar</a></p>
          <button type="submit" class="botao">
            Próximo
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M14 6l6 6-6 6"/></svg>
          </button>
        </div>
      </form>
    </section>

  </main>

  <script src="cadastro-paciente.js"></script>
</body>
</html>
