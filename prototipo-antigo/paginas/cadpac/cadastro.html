<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FacilMed · Cadastro</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="pagina">

    <!-- Painel da marca -->
    <section class="marca" aria-label="FacilMed">
      <div class="circulo circulo--1"></div>
      <div class="circulo circulo--2"></div>
      <div class="circulo circulo--3"></div>

      <div class="logo">
        <img class="logo__imagem" src="logo.svg" width="160" height="140" alt="" />
        <div class="logo__nome"><span>Facil</span><span>Med</span></div>
        <p class="logo__slogan">Sua saúde, conectada.</p>
      </div>
    </section>

    <!-- Painel de escolha -->
    <section class="escolha">
      <div class="escolha__conteudo">
        <h1>Como você deseja se cadastrar?</h1>
        <p class="subtitulo">Escolha uma opção para continuar</p>

        <nav class="opcoes" aria-label="Tipo de cadastro">
          <a class="botao" href="/cadastro/paciente">Sou paciente</a>
          <a class="botao" href="/cadastro/clinica">Sou clínica/hospital</a>
        </nav>

        <p class="entrar">Já tem uma conta? <a href="/login">Entre</a></p>
      </div>
    </section>

  </main>
</body>
</html>
