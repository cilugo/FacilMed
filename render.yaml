# =====================================================================
# FacilMed — configuração do servidor no Render (Blueprint).
# Passo a passo: README §2.7.
#
# O Render lê este arquivo e cria o site sozinho. A cada push na main
# ele monta de novo (Dockerfile) e publica. Se o build falhar, a versão
# anterior continua no ar.
#
# As variáveis com "sync: false" são segredos ou dados do grupo: o Render
# pede na hora de criar (ou se preenche em Environment) e elas NUNCA vão
# para o Git.
# =====================================================================
services:
  - type: web
    runtime: docker
    name: facilmed
    plan: free
    region: virginia
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      # --- Segredos (preenchidos no painel do Render) ---
      - key: APP_KEY          # chave do Laravel: "base64:...."
        sync: false
      - key: DB_URL           # "Service URI" do MySQL no Aiven
        sync: false
      - key: MYSQL_CA_CERT    # texto do "CA certificate" do Aiven
        sync: false
      # 01/10/2026 — e-mail de verdade (README §2.7). Sem a chave, fica no log.
      - key: BREVO_API_KEY    # Brevo → SMTP & API → API keys ("xkeysib-...")
        sync: false
      - key: MAIL_FROM_ADDRESS  # o e-mail remetente CONFIRMADO no Brevo
        sync: false
      # 01/10/2026 — admin com e-mail real (facilmed:garantir-admin, no boot).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD   # senha inicial (mín. 8); depois, troque pelo site
        sync: false

      # --- Fixas ---
      - key: APP_NAME
        value: PointMed
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: pt_BR
      - key: APP_FALLBACK_LOCALE
        value: pt_BR
      - key: APP_FAKER_LOCALE
        value: pt_BR
      - key: LOG_CHANNEL
        value: stderr        # logs aparecem na aba "Logs" do Render
      - key: DB_CONNECTION
        value: mysql
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: MAIL_MAILER
        value: brevo         # só envia com BREVO_API_KEY; sem ela, volta para "log"
      - key: MAIL_FROM_NAME
        value: PointMed
