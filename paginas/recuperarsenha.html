<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Recuperar Senha | FacilMed</title>

    <link rel="stylesheet"
          href="css/style.css">

    <link rel="stylesheet"
          href="css/recuperarSenha.css">

</head>

<body>

<header>

    <h1>FacilMed</h1>

</header>


<main class="container">

    <section class="card recuperacao">

        <h2>Recuperar senha</h2>

        <p>
            Informe o e-mail utilizado no cadastro.
        </p>


        <form
            action="php/recuperarsenha.php"
            method="POST">

            <div class="campo">

                <label for="email">

                    E-mail

                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="exemplo@email.com"
                    required>

            </div>


            <button
                type="submit"
                class="botao">

                Continuar

            </button>

        </form>


        <br>

        <a href="login.html">

            Voltar para o login

        </a>

    </section>

</main>


<footer>

    © 2026 FacilMed

</footer>

</body>

</html>
