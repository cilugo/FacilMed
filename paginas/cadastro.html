<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facilmed - Criar sua conta</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f4f7fa;
            min-height: 100vh;
        }

        /* Tela principal */
        .container {
            width: 100%;
            min-height: 100vh;
            background-color: #f4f7fa;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Conteúdo */
        .conteudo {
            width: 100%;
            max-width: 420px;
            flex: 1;

            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 55px;
        }

        /* Logo */
        .logo {
            width: 95px;
            height: 95px;

            display: flex;
            justify-content: center;
            align-items: center;

            margin-bottom: 8px;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Caso ainda não tenha a imagem do logo */
        .logo-facilmed {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            position: relative;
        }

        .logo-facilmed .circulo {
            width: 70px;
            height: 70px;
            border: 10px solid #2445a3;
            border-top-color: #20a9e8;
            border-radius: 50%;
            transform: rotate(-35deg);
            position: absolute;
            top: 7px;
            left: 7px;
        }

        .logo-facilmed .coracao {
            position: absolute;
            width: 28px;
            height: 28px;
            background: #4f9fd2;
            transform: rotate(-45deg);
            left: 29px;
            top: 32px;
            border-radius: 5px;
        }

        .logo-facilmed .coracao::before,
        .logo-facilmed .coracao::after {
            content: "";
            width: 28px;
            height: 28px;
            background: #4f9fd2;
            border-radius: 50%;
            position: absolute;
        }

        .logo-facilmed .coracao::before {
            top: -14px;
            left: 0;
        }

        .logo-facilmed .coracao::after {
            top: 0;
            left: 14px;
        }

        /* Título */
        h1 {
            color: #2445a3;
            font-size: 24px;
            font-weight: 700;
            margin-top: 5px;
            margin-bottom: 10px;
            text-align: center;
        }

        /* Subtítulo */
        .subtitulo {
            color: #2445a3;
            font-size: 14px;
            margin-bottom: 64px;
            text-align: center;
        }

        /* Botões */
        .botoes {
            width: 82%;
            max-width: 330px;

            display: flex;
            flex-direction: column;
            gap: 54px;
        }

        .btn {
            width: 100%;
            height: 38px;

            border: none;
            border-radius: 25px;

            background-color: #2747a5;
            color: white;

            font-size: 14px;
            cursor: pointer;

            transition: 0.2s;
        }

        .btn:hover {
            background-color: #1d3889;
            transform: scale(1.01);
        }

        /* Login */
        .login {
            margin-top: 59px;

            font-size: 11px;
            color: #319ee0;

            text-align: center;
        }

        .login a {
            color: #319ee0;
            text-decoration: underline;
            cursor: pointer;
        }

        /* Rodapé */
        footer {
            width: 100%;
            height: 34px;

            background-color: #2747a5;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #8fa7df;
            font-size: 10px;
        }

        /* Responsividade */
        @media (min-width: 600px) {

            .container {
                max-width: 100%;
            }

            .conteudo {
                max-width: 420px;
            }

            footer {
                height: 45px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <main class="conteudo">

            <!-- TÍTULO -->
            <h1>Crie sua conta</h1>

            <!-- SUBTÍTULO -->
            <p class="subtitulo">
                Preencha os dados abaixo
            </p>

            <!-- BOTÕES -->
            <div class="botoes">

                <button class="btn" onclick="souPaciente()">
                    Sou paciente
                </button>

                <button class="btn" onclick="souMedico()">
                    Sou Médico
                </button>

            </div>

            <!-- LOGIN -->
            <p class="login">
                Já tem uma conta?
                <a onclick="fazerLogin()">Fazer login</a>
            </p>

        </main>

        <!-- RODAPÉ -->
        <footer>
            2026©Facilmed
        </footer>

    </div>


    <script>

        function souPaciente() {
            alert("Cadastro de paciente");
        }

        function souMedico() {
            alert("Cadastro de médico");
        }

        function fazerLogin() {
            alert("Página de login");
        }

    </script>

</body>
</html>
