<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facilmed - Criar sua conta</title>

    <style>

        /* =========================
           CONFIGURAÇÕES GERAIS
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f4f7fa;
            min-height: 100vh;
        }


        /* =========================
           NAVEGADOR
        ========================= */

        .navbar {
            width: 100%;
            height: 110px;

            background-color: #ffffff;

            display: flex;
            align-items: center;

            padding: 0 7%;

            border-bottom: 1px solid #e1e5e9;
        }


        /* =========================
           MENU
        ========================= */

        .menu {
            height: 100%;

            display: flex;
            align-items: center;

            gap: 40px;
        }

        .menu a {
            height: 100%;

            display: flex;
            align-items: center;

            position: relative;

            color: #111111;

            text-decoration: none;

            font-size: 16px;
            font-weight: 600;

            transition: 0.2s;
        }

        /* Quando passar o mouse */

        .menu a:hover {
            color: #2196e5;
        }

        /* Página selecionada */

        .menu a.ativo {
            color: #2196e5;
        }

        .menu a.ativo::after {

            content: "";

            position: absolute;

            bottom: 0;
            left: 0;

            width: 100%;
            height: 3px;

            background-color: #2196e5;
        }


        /* =========================
           CONTAINER
        ========================= */

        .container {
            width: 100%;
            min-height: calc(100vh - 110px);

            background-color: #f4f7fa;

            display: flex;
            flex-direction: column;
            align-items: center;
        }


        /* =========================
           CONTEÚDO
        ========================= */

        .conteudo {

            width: 100%;
            max-width: 420px;

            flex: 1;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding-top: 70px;
        }


        /* =========================
           TÍTULO
        ========================= */

        h1 {

            color: #2445a3;

            font-size: 22px;
            font-weight: 700;

            margin-top: 5px;
            margin-bottom: 10px;

            text-align: center;
        }


        /* =========================
           SUBTÍTULO
        ========================= */

        .subtitulo {

            color: #2445a3;

            font-size: 13px;

            margin-bottom: 64px;

            text-align: center;
        }


        /* =========================
           BOTÕES
        ========================= */

        .botoes {

            width: 82%;
            max-width: 330px;

            display: flex;
            flex-direction: column;

            gap: 54px;
        }

        .btn {

            width: 100%;
            height: 38px;

            border: none;

            border-radius: 25px;

            background-color: #2747a5;

            color: white;

            font-size: 13px;

            cursor: pointer;

            transition: 0.2s;
        }

        .btn:hover {

            background-color: #1d3889;

            transform: scale(1.01);
        }


        /* =========================
           LOGIN
        ========================= */

        .login {

            margin-top: 59px;

            font-size: 11px;

            color: #319ee0;

            text-align: center;
        }

        .login a {

            color: #319ee0;

            text-decoration: underline;

            cursor: pointer;
        }


        /* =========================
           RODAPÉ
        ========================= */

        footer {

            width: 100%;
            height: 45px;

            background-color: #2747a5;

            display: flex;

            align-items: center;
            justify-content: center;

            color: #8fa7df;

            font-size: 10px;
        }


        /* =========================
           RESPONSIVIDADE
        ========================= */

        @media (max-width: 900px) {

            .navbar {

                padding: 0 30px;
            }

            .menu {

                gap: 22px;
            }

            .menu a {

                font-size: 14px;
            }
        }


        @media (max-width: 650px) {

            .navbar {

                height: auto;

                min-height: 80px;

                padding: 15px 20px;

                flex-direction: column;

                gap: 15px;
            }

            .logo-navbar {

                margin-right: 0;
            }

            .menu {

                width: 100%;

                height: auto;

                justify-content: center;

                flex-wrap: wrap;

                gap: 15px;
            }

            .menu a {

                height: 35px;

                font-size: 13px;
            }

            .menu a.ativo::after {

                bottom: 0;
            }

            .container {

                min-height: calc(100vh - 140px);
            }
        }

    </style>

</head>


<body>


    <!-- =========================
         NAVEGADOR
    ========================= -->

    <header class="navbar">

        </div>


        <!-- MENU -->

        <nav class="menu">

            <a href="#" class="ativo">
                Início
            </a>

        </nav>

    </header>



    <!-- =========================
         CONTEÚDO PRINCIPAL
    ========================= -->

    <div class="container">


        <main class="conteudo">


            <!-- TÍTULO -->

            <h1>
                Crie sua conta
            </h1>


            <!-- SUBTÍTULO -->

            <p class="subtitulo">
                Preencha os dados abaixo
            </p>


            <!-- BOTÕES -->

            <div class="botoes">


                <button
                    class="btn"
                    onclick="souPaciente()">

                    Sou paciente

                </button>


                <button
                    class="btn"
                    onclick="souMedico()">

                    Clínica

                </button>


            </div>


            <!-- LOGIN -->

            <p class="login">

                Já tem uma conta?

                <a onclick="fazerLogin()">
                    Fazer login
                </a>

            </p>


        </main>


        <!-- =========================
             RODAPÉ
        ========================= -->

        <footer>

            2026©Facilmed

        </footer>


    </div>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        function souPaciente() {

            alert("Cadastro de paciente");

        }


        function souMedico() {

            alert("Cadastro de médico");

        }


        function fazerLogin() {

            alert("Página de login");

        }


    </script>


</body>

</html>
