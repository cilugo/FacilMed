<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facilmed - Criar sua conta</title>
    <link rel="stylesheet" href="../css/precadastro.css">

</head>


<body>


    <!-- =========================
         NAVEGADOR
    ========================= -->

    <header class="navbar">

        <!-- MENU -->

        <nav class="menu">

            <a href="#" class="ativo">
                Início
            </a>

        </nav>

    </header>



    <!-- =========================
         CONTEÚDO PRINCIPAL
    ========================= -->

    <div class="container">


        <main class="conteudo">


            <!-- TÍTULO -->

            <h1>
                Crie sua conta
            </h1>


            <!-- SUBTÍTULO -->

            <p class="subtitulo">
                Preencha os dados abaixo
            </p>


            <!-- BOTÕES -->

            <div class="botoes">


                <button
                    class="btn"
                    onclick="souPaciente()">

                    Sou paciente

                </button>


                <button
                    class="btn"
                    onclick="souClinica()">

                    Sou clínica

                </button>

                <button
                    class="btn"
                    onclick="souMedico()">

                    Sou médico

                </button>


            </div>


            <!-- LOGIN -->

            <p class="login">

                Já tem uma conta?

                <a onclick="fazerLogin()">
                    Fazer login
                </a>

            </p>


        </main>


        <!-- =========================
             RODAPÉ
        ========================= -->

        <footer>

            2026©Facilmed

        </footer>


    </div>



    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script>


        function souPaciente() {

            alert("Cadastro de paciente");

        }


        function souMedico() {

            alert("Cadastro de médico");

        }

        function souClinica() {

            alert("Cadastro de clínica");

        }


        function fazerLogin() {

            alert("Página de login");

        }


    </script>


</body>

</html>
