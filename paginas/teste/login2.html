<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facilmed - Login</title>

    <link rel="stylesheet" href="login2.css">
</head>


<body>

    <main class="login-page">

        <!-- PAINEL DA MARCA (some no celular) -->
        <section class="login-brand">
            <div class="login-brand__blob login-brand__blob--1"></div>
            <div class="login-brand__blob login-brand__blob--2"></div>
            <div class="login-brand__blob login-brand__blob--3"></div>

            <img
                src="../teste/logocomslogan.png"
                alt="FacilMed - Sua saúde, conectada."
                class="login-brand__logo"
            >
        </section>


        <!-- PAINEL DO FORMULÁRIO -->
        <section class="login-form-area">

            <div class="login-container">

                <!-- LOGO (só aparece no celular, no lugar do painel da marca) -->
                <img
                    src="../imgs/logocomslogan.png"
                    alt="FacilMed"
                    class="login-mobile-logo"
                >

                <!-- TÍTULO -->
                <h1 class="title">
                    Bem-vindo de Volta!
                </h1>

                <p class="subtitle">
                    Faça login para continuar
                </p>


                <!-- FORMULÁRIO -->
                <form action="../php/login.php" method="POST">


                    <!-- E-MAIL -->
                    <div class="form-group">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            class="input"
                            type="email"
                            id="email"
                            name="email"
                            placeholder="exemplo@dominio.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- SENHA -->
                    <div class="form-group">

                        <label for="senha">
                            Senha
                        </label>

                        <input
                            class="input"
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Mínimo 6 caracteres"
                            autocomplete="current-password"
                            required
                        >

                    </div>


                    <!-- ESQUECI SENHA -->
                    <a
                        href="recuperarsenha.html"
                        class="forgot-password"
                    >
                        Esqueci minha senha
                    </a>


                    <!-- BOTÃO -->
                    <button
                        type="submit"
                        class="login-button"
                    >
                        Entrar
                    </button>

                </form>


                <!-- SEPARADOR -->
                <div class="divider">

                    <span>
                        ou entre com
                    </span>

                </div>


                <!-- LOGIN COM GOOGLE -->
                <a href="../php/google-login.php" class="google-button">
                    <svg class="google-icon" viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
                        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
                        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
                        <path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4C29.7 35.5 27 36.5 24 36.5c-5.2 0-9.6-3.3-11.3-7.9l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/>
                        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.1 5.7l6.6 5.4C41.5 35.9 44 30.4 44 24c0-1.3-.1-2.7-.4-3.5z"/>
                    </svg>
                    Entrar com o Google
                </a>


                <!-- CADASTRO -->
                <p class="register">

                    Não tem uma conta?

                    <a href="cadastro.html">
                        Cadastre-se
                    </a>

                </p>

            </div>

        </section>

    </main>

    <footer class="rodape-login">&copy; 2026 FacilMed</footer>

</body>

</html>
