<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Paciente | FacilMed</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <header>
        <h1>FacilMed</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="cadastro.html">Cadastre-se</a></li>
        </ul>
    </nav>
    <main class="container">
        <section class="card">
            <h1>Cadastro de Paciente</h1>
            <p>Preencha todos os campos abaixo para criar sua conta no FacilMed.</p>
            <form id="formCadastro" action="php/cadastroPaciente.php" method="POST">
                <div class="campo">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" maxlength="100" required placeholder="Digite seu nome completo">
                    <small class="erro"></small>
                </div>
                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input type="text" id="cpf" name="cpf" maxlength="14" required placeholder="000.000.000-00">
                    <small class="erro"></small>
                </div>
                <div class="campo">
                    <label for="dataNascimento">Data de Nascimento</label>
                    <input type="date" id="dataNascimento" name="dataNascimento" required>
                </div>
                <div class="campo">
                    <label for="sexo">Sexo</label>
                    <select id="sexo" name="sexo" required>
                        <option value="">Selecione</option>
                        <option>Masculino</option>
                        <option>Feminino</option>
                        <option>Prefiro não informar</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" name="telefone" maxlength="15" placeholder="(00) 00000-0000" required>
                </div>
                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" maxlength="100" placeholder="exemplo@email.com" required>
                    <small class="erro"></small>
                </div>
                <div class="campo senha">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" minlength="8" maxlength="9" required>
                    <i class="fa-solid fa-eye olho" id="mostrarSenha"></i>
                    <div class="barraSenha">
                        <div class="forca" id="forcaSenha"></div>
                    </div>
                </div>
                <div class="campo senha">
                    <label for="confirmarSenha">Confirmar Senha</label>
                    <input type="password" id="confirmarSenha" name="confirmarSenha" minlength="8" maxlength="9" required>
                    <i class="fa-solid fa-eye olho" id="mostrarConfirmacao"></i>
                </div>
                <div class="campo">
                    <label>
                        <input type="checkbox" required>
                        Li e aceito os Termos de Uso.
                    </label>
                </div>
                <div class="botoes">
                    <button type="reset" class="botaoSecundario">Limpar</button>
                    <button type="submit" class="botao">Cadastrar</button>
                </div>
            </form>
            <hr>
            <p>Já possui uma conta?</p>
            <a href="login.html" class="botao">Fazer Login</a>
        </section>
    </main>
    <footer>
        © 2026 FacilMed - Todos os direitos reservados.
    </footer>
    <script src="js/mascaras.js"></script>
    <script src="js/validacoes.js"></script>
    <script src="js/cadastroPaciente.js"></script>
</body>
</html>
