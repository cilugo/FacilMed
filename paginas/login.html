<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <form class="login" method="POST" action="../php/login.php">
        <h2>Login</h2>
        <h3>Insira seus dados</h3>
        <p>Insira seu E-mail</p>
        <input type="email" placeholder="endereço@gmail.com" name="email" required>
        <p>Senha</p>
        <input type="password" placeholder="123abc" name="senha" minlength="6" required>
        <a href="recuperarsenha.html">Esqueci minha senha</a>
        <hr>
        <button type="submit">Entrar</button>
        <p class="Mensagem" id="Mensagem"></p>
    </form>

</body>
</html>
