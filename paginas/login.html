<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facilmed - Login</title>

    <link rel="stylesheet" href="../css/login.css">
</head>


<body>

    <main class="login-page">

        <section class="login-container">

            <!-- LOGO -->
            <div class="logo">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Logo FacilMed">
                    <path d="M50 10 C32 10 18 23 17 40 C16 57 26 70 42 77 C28 69 22 57 24 43 C26 28 38 18 51 18 C61 18 68 22 73 29 C67 17 59 11 50 10Z" fill="#159ddd"/>
                    <path d="M72 10 C84 25 87 43 80 60 C73 79 57 88 40 85 C25 82 14 71 11 57 C20 69 31 76 44 77 C62 78 75 65 76 48 C77 35 73 24 68 17 C69 14 70 12 72 10Z" fill="#21429c"/>
                    <path d="M50 66 C46 62 32 53 32 43 C32 35 38 30 45 31 C48 31 51 33 53 36 C55 33 58 31 62 31 C69 31 74 36 74 43 C74 53 61 62 50 70Z" fill="#2353a8"/>
                    <path d="M51 61 C47 57 37 51 37 44 C37 39 40 36 45 36 C48 36 51 38 53 41 C55 38 58 36 61 36 C66 36 69 39 69 44 C69 51 59 57 51 64Z" fill="#50a5db"/>
                </svg>
            </div>


            <!-- TÍTULO -->
            <h1 class="title">
                Bem-vindo de Volta!
            </h1>


            <p class="subtitle">
                Faça login para continuar
            </p>


            <!-- FORMULÁRIO -->
            <form action="../php/login.php" method="POST">


                <!-- E-MAIL -->
                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        class="input"
                        type="email"
                        id="email"
                        name="email"
                        placeholder="exemplo@dominio.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- SENHA -->
                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        class="input"
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Mínimo 6 caracteres"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- ESQUECI SENHA -->
                <a
                    href="recuperarsenha.html"
                    class="forgot-password"
                >
                    Esqueci minha senha
                </a>


                <!-- BOTÃO -->
                <button
                    type="submit"
                    class="login-button"
                >
                    Entrar
                </button>

            </form>


            <!-- SEPARADOR -->
            <div class="divider">

                <span>
                    ou entre com
                </span>

            </div>


            <!-- CADASTRO -->
            <p class="register">

                Não tem uma conta?

                <a href="cadastro.html">
                    Cadastre-se
                </a>

            </p>

        </section>

    </main>

    <footer class="rodape-login">&copy; 2026 FacilMed - Todos os direitos reservados.</footer>

</body>

</html>
