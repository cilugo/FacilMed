<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Facilmed - Login</title>

    <link rel="stylesheet" href="../css/login.css">
</head>


<body>

    <main class="login-page">

        <section class="login-container">

            <!-- LOGO -->
            <div class="logo">
                <img src="../imgs/logocomslogan.png" alt="Logo com slogan">
            </div><br>

    

            <!-- TÍTULO -->
            <h1 class="title">
                Bem-vindo ao FacilMed!
            </h1>


            <p class="subtitle">
                Faça login para continuar
            </p>


            <!-- FORMULÁRIO -->
            <form action="../php/login.php" method="POST">


                <!-- E-MAIL -->
                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        class="input"
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Exemplo@dominio.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- SENHA -->
                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        class="input"
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Senha"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- ESQUECI SENHA -->
                <a
                    href="recuperarsenha.html"
                    class="forgot-password"
                >
                    Esqueci minha senha
                </a>


                <!-- BOTÃO -->
                <button
                    type="submit"
                    class="login-button"
                >
                    Entrar
                </button>

            </form>


            <!-- SEPARADOR -->
            <div class="divider">

                <span>
                    ou entre com
                </span>

            </div>


            <!-- CADASTRO -->
            <p class="register">

                Não tem uma conta?

                <a href="cadastro.html">
                    Cadastre-se
                </a>

            </p>

        </section>

    </main>

    <footer class="rodape-login">&copy; 2026 FacilMed</footer>

</body>

</html>
